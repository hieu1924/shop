services:
  db:
    image: postgres:17
    container_name: shop-db
    restart: unless-stopped
    # Log mọi truy vấn chậm hơn 200ms (mục 2.1): xem bằng `docker logs shop-db`
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_DB: shop
      POSTGRES_USER: ${DB_USER:-shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop}
    ports:
      - "5435:5432"
    volumes:
      - shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mục 2.6: cache sản phẩm (và rate limit ở mục 3.6)
  redis:
    image: redis:7
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shop_pgdata:
