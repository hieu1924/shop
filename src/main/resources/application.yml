spring:
  application:
    name: shop
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 500ms # Redis chậm thì bỏ qua nhanh, đừng kéo cả request theo
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    publisher-confirm-type: correlated # OutboxRelay chờ broker xác nhận rồi mới đánh dấu published
    listener:
      simple:
        concurrency: 2
        max-concurrency: 10
        prefetch: 20
        default-requeue-rejected: false # hết lượt retry -> sang DLQ, không lặp vô hạn
        retry:
          enabled: true
          max-retries: 3 # số lần THỬ LẠI sau lần đầu (bài ghi max-attempts, tên này đã deprecated ở Boot 4)
          initial-interval: 1s
          multiplier: 2
  cache:
    type: redis
    redis:
      time-to-live: 10m # TTL mặc định: lưới an toàn nếu quên evict
  jpa:
    open-in-view: false # tránh giữ kết nối DB suốt request
    hibernate:
      ddl-auto: validate # schema do Flyway quản lý, không để Hibernate tự sửa
    properties:
      hibernate:
        default_batch_fetch_size: 50 # gom lazy loading thành truy vấn IN (...), chống N+1
        # generate_statistics: true  # chỉ bật khi điều tra, không để ở production
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring chỉ kiểm tra chữ ký bằng public key. Mặc định là khóa DEV (ai có repo cũng ký được token):
          # production PHẢI đặt JWT_PUBLIC_KEY_LOCATION tới public key của identity provider. Xem dev/README.md
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:jwt/dev-public.pem}
  lifecycle:
    timeout-per-shutdown-phase: 20s # chờ tối đa 20s cho request đang chạy
  threads:
    virtual:
      enabled: true # Java 21: virtual threads cho Tomcat, @Async, @Scheduled

# Mục 2.3 + 3.1: hai pool Hikari, định tuyến theo @Transactional(readOnly) (xem DataSourceConfig).
# ApplicationName giúp nhận ra kết nối đang đi pool nào: select current_setting('application_name').
# Local chưa có replica thật nên replica mặc định trỏ về cùng DB; production đặt DB_REPLICA_HOST.
app:
  datasource:
    primary:
      pool-name: shop-primary
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/shop?ApplicationName=shop-primary
      username: ${DB_USER:shop}
      password: ${DB_PASSWORD}
      maximum-pool-size: 20 # mỗi instance; số instance × giá trị này (cả hai pool) phải < max_connections của DB
      minimum-idle: 5
      connection-timeout: 3000 # ms: chờ lấy kết nối tối đa 3s rồi báo lỗi, đừng treo
      max-lifetime: 1800000 # 30 phút, nên ngắn hơn timeout phía DB/proxy
    replica:
      pool-name: shop-replica
      jdbc-url: jdbc:postgresql://${DB_REPLICA_HOST:${DB_HOST:localhost}}:${DB_REPLICA_PORT:${DB_PORT:5435}}/shop?ApplicationName=shop-replica
      username: ${DB_USER:shop}
      password: ${DB_PASSWORD}
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
      read-only: true

  rate-limit:
    per-minute: 120 # mỗi user (hoặc mỗi IP nếu chưa đăng nhập), dùng chung giữa các instance qua Redis
  payment:
    base-url: ${PAYMENT_BASE_URL:http://localhost:9090} # chưa có nhà cung cấp thật; gọi sẽ lỗi -> fallback PENDING
    connect-timeout: 2s
    read-timeout: 5s

# Mục 3.5: retry bọc ngoài circuit breaker (xem PaymentGateway)
resilience4j:
  circuitbreaker:
    instances:
      payment:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50 # >= 50% lỗi trong 20 lần gọi gần nhất -> mở mạch
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50 # quá chậm cũng tính là lỗi
        wait-duration-in-open-state: 30s # 30s sau thử lại vài request
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException # 4xx là lỗi của request, không phải của đối tác
  retry:
    instances:
      payment:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException # lỗi mạng, timeout
          - org.springframework.web.client.HttpServerErrorException # 5xx (vd. 503)

server:
  shutdown: graceful # xử lý xong request đang chạy rồi mới tắt
  forward-headers-strategy: native # tin header X-Forwarded-* từ proxy để biết IP thật, https

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: false # SMTP chậm/chết không được làm /actuator/health báo DOWN

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
