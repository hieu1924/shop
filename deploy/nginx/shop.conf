# Mục 2.5: Nginx đứng trước 2 instance app. CHƯA được chạy thử trong dự án này.
upstream shop_app {
    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    # Actuator chỉ dành cho nội bộ (Prometheus, probe của orchestrator), không phơi ra internet
    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://shop_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
