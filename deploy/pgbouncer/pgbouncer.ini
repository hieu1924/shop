; Mục 2.3 / 3.1: PgBouncer transaction pooling giữa app và PostgreSQL. CHƯA được chạy thử trong dự án này.
; App trỏ jdbc-url tới cổng 6432 của PgBouncer thay vì cổng PostgreSQL.
[databases]
shop = host=db-primary port=5432 dbname=shop
shop_replica = host=db-replica port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000       ; tổng kết nối từ mọi instance app
default_pool_size = 40       ; kết nối thật tới PostgreSQL cho mỗi cặp user/database
; Transaction pooling + prepared statement: PgBouncer >= 1.21 hỗ trợ qua tham số dưới.
; Với bản cũ hơn, thêm prepareThreshold=0 vào JDBC URL của app.
max_prepared_statements = 200
